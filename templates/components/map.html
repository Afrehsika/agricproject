<!-- Map View Container (Under Logistics & Dispatch) -->
<section class="map-section" style="margin-bottom: 24px;">
    <!-- 📡 IoT Telematics & Real-Time Tracking Header -->
    <div class="iot-status-bar" style="background: linear-gradient(135deg, #064e3b 0%, #022c22 100%); border: 1px solid #10b981; border-radius: 16px; padding: 14px 20px; margin-bottom: 16px; color: #ffffff; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; box-shadow: 0 6px 20px rgba(6, 78, 59, 0.2);">
        <div style="display: flex; align-items: center; gap: 12px;">
            <div class="iot-pulse-indicator" style="width: 14px; height: 14px; background-color: #34d399; border-radius: 50%; box-shadow: 0 0 14px #34d399; position: relative;">
                <div style="position: absolute; width: 100%; height: 100%; border-radius: 50%; background-color: rgba(52, 211, 153, 0.6); animation: iot-ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;"></div>
            </div>
            <div>
                <h4 style="font-size: 14px; font-weight: 800; font-family: var(--font-display); color: #ffffff; margin: 0; display: flex; align-items: center; gap: 8px;">
                    <i class="fa-solid fa-microchip" style="color: #34d399;"></i> IoT Vehicle Telematics & Live GPS Tracking
                </h4>
                <p style="font-size: 11px; color: #a7f3d0; margin: 2px 0 0 0; font-weight: 500;">
                    Real-time transponders installed on KIA Bongo trucks and Aboboyaa tricycles
                </p>
            </div>
        </div>

        <div style="display: flex; align-items: center; gap: 16px; font-size: 11px; color: #ffffff; font-weight: 700; flex-wrap: wrap;">
            <div style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); padding: 4px 10px; border-radius: 50px;">
                <i class="fa-solid fa-satellite-dish" style="color: #34d399;"></i> GPS Signal: <span style="color: #6ee7b7;">Active (4G LTE)</span>
            </div>
            <div style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); padding: 4px 10px; border-radius: 50px;">
                <i class="fa-solid fa-temperature-arrow-down" style="color: #f59e0b;"></i> Cold Chain Temp: <span style="color: #fde68a;">18.4 °C</span>
            </div>
            <div style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); padding: 4px 10px; border-radius: 50px;">
                <i class="fa-solid fa-gauge-high" style="color: #38bdf8;"></i> Avg Speed: <span style="color: #bae6fd;">42 km/h</span>
            </div>
        </div>
    </div>

    <div class="map-controls-row" style="margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
        <div class="map-header" style="margin-bottom: 0;">
            <h3 style="font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 8px; font-family: var(--font-display); color: #0f172a;">
                <i class="fa-solid fa-earth-africa" style="color: #10b981;"></i> Techiman Geolocation Haulage & Supply Map
            </h3>
        </div>
        
        <div class="map-controls-group" style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
            <!-- Filter by Crop -->
            <select class="map-ctrl-select" id="map-filter-crop" style="background-color: #ffffff !important; border: 1px solid #cbd5e1 !important; color: #0f172a !important; padding: 6px 12px !important; border-radius: 50px !important; font-size: 11px !important; outline: none !important; cursor: pointer !important; font-family: var(--font-sans) !important; font-weight: 600 !important;">
                <option value="">All Crops</option>
                <option value="Tomatoes">Tomatoes</option>
                <option value="Peppers">Peppers</option>
                <option value="Garden Eggs">Garden Eggs</option>
            </select>
            <!-- Distance Filter -->
            <select class="map-ctrl-select" id="map-filter-dist" style="background-color: #ffffff !important; border: 1px solid #cbd5e1 !important; color: #0f172a !important; padding: 6px 12px !important; border-radius: 50px !important; font-size: 11px !important; outline: none !important; cursor: pointer !important; font-family: var(--font-sans) !important; font-weight: 600 !important;">
                <option value="50">Within 50 km</option>
                <option value="20">Within 20 km</option>
                <option value="10">Within 10 km</option>
            </select>
            <!-- Toggle IoT Transporters Only -->
            <button class="map-ctrl-btn active" id="btn-toggle-iot" onclick="this.classList.toggle('active')" style="background-color: #10b981 !important; border: 1px solid #10b981 !important; color: #ffffff !important; padding: 6px 14px !important; border-radius: 50px !important; font-size: 11px !important; cursor: pointer !important; display: inline-flex !important; align-items: center !important; gap: 6px !important; font-weight: 700 !important; outline: none !important;">
                <i class="fa-solid fa-truck-microchip"></i> Show IoT Vehicles
            </button>
        </div>
    </div>
    
    <div class="map-wrapper card" style="padding: 0; overflow: hidden; border-radius: 18px; border: 1px solid #cbd5e1; box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);">
        <div id="supply-map" style="height: 360px;"></div>
    </div>
</section>

<style>
@keyframes iot-ping {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(2.2); opacity: 0; }
}
</style>
