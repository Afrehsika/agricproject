<!-- Header Top Bar -->
<header class="bg-white border-b border-slate-200 px-6 py-3 flex justify-between items-center flex-wrap gap-3 shrink-0">
    <div class="flex items-center gap-3 flex-wrap">
        <!-- Mobile Menu Toggle -->
        <button id="mobile-menu-toggle" class="sm:hidden bg-white border border-slate-300 text-slate-700 px-3 py-2 rounded-lg flex items-center justify-center hover:bg-slate-50 transition-colors">
            <i class="fa-solid fa-bars"></i>
        </button>
        <!-- Weather Widget -->
        <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-full px-4 py-1.5 text-xs text-slate-700 font-semibold shadow-sm">
            <i class="fa-solid fa-cloud-sun text-amber-400"></i>
            <span>Techiman, Bono East: 29°C · Sunny</span>
        </div>
        <!-- Price Ticker -->
        <div class="hidden md:block overflow-hidden bg-slate-50 border border-slate-200 rounded-full px-4 py-1.5 text-xs text-slate-500 max-w-[260px] shadow-sm relative">
            <div class="flex gap-6 whitespace-nowrap animate-[ticker_20s_linear_infinite] items-center">
                <div class="inline-block whitespace-nowrap shrink-0">Tomatoes: <span class="text-primary-600 font-bold">GHS 120/crate</span></div>
                <div class="inline-block whitespace-nowrap shrink-0">Peppers: <span class="text-primary-600 font-bold">GHS 95/crate</span></div>
                <div class="inline-block whitespace-nowrap shrink-0">Garden Eggs: <span class="text-primary-600 font-bold">GHS 80/bag</span></div>
                <div class="inline-block whitespace-nowrap shrink-0">Okra: <span class="text-primary-600 font-bold">GHS 55/basket</span></div>
            </div>
        </div>
    </div>

    <div class="flex items-center gap-3 flex-wrap">
        <!-- Date -->
        <div class="text-xs text-slate-500 font-semibold hidden sm:block">
            <i class="fa-regular fa-calendar-days text-primary-500"></i> <span id="header-date">{% now "F j, Y" %}</span>
        </div>
        <!-- Cart Button -->
        <button id="header-cart-btn" class="hidden relative bg-white border border-slate-300 rounded-full px-4 py-1.5 text-sm text-slate-700 font-medium shadow-sm hover:bg-slate-50 transition-colors">
            <i class="fa-solid fa-cart-shopping text-primary-500 mr-1"></i> Cart (<span id="header-cart-badge">0</span>)
        </button>
        <!-- Alerts Bell -->
        <button id="header-alerts-btn" class="relative bg-white border border-slate-300 rounded-full w-9 h-9 flex items-center justify-center text-slate-700 shadow-sm hover:bg-slate-50 transition-colors">
            <i class="fa-solid fa-bell text-primary-500 text-sm"></i>
            <span id="header-alerts-badge" class="hidden absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
        </button>
        <!-- Wallet Display -->
        <div class="bg-gradient-to-br from-amber-50 to-amber-100 border border-amber-200 text-amber-800 rounded-full px-4 py-1.5 flex items-center gap-2 font-bold shadow-sm text-sm">
            <i class="fa-solid fa-wallet text-amber-500"></i>
            <span>GHS <span id="header-wallet-balance">0.00</span></span>
        </div>
    </div>
</header>
