<!-- Header -->
<header class="main-header" style="display: flex; flex-direction: column; gap: 16px;">
    <!-- Top Meta Row -->
    <div class="header-meta-row" style="display: flex; justify-content: space-between; align-items: center; width: 100%; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; flex-wrap: wrap; gap: 12px;">
        <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
            <!-- Weather Widget -->
            <div class="weather-widget" style="display: flex; align-items: center; gap: 8px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 50px; padding: 6px 14px; font-size: 11px; color: #1e293b; font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,0.03);">
                <i class="fa-solid fa-cloud-sun" style="color: #f59e0b;"></i>
                <span>Techiman, Bono East: 29°C • Sunny</span>
            </div>
            <!-- Price Ticker -->
            <div class="ticker-wrap" style="overflow: hidden; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 50px; padding: 6px 16px; font-size: 11px; color: #64748b; max-width: 280px; white-space: nowrap; position: relative; display: inline-block; vertical-align: middle; box-shadow: 0 2px 8px rgba(0,0,0,0.03);">
                <div class="ticker-move" style="display: flex; gap: 24px; white-space: nowrap; animation: ticker 20s linear infinite; align-items: center;">
                    <div class="ticker-item" style="display: inline-block; white-space: nowrap; flex-shrink: 0;">Tomatoes: <span style="color: #059669; font-weight: 700;">GHS 120.00/crate</span></div>
                    <div class="ticker-item" style="display: inline-block; white-space: nowrap; flex-shrink: 0;">Peppers: <span style="color: #059669; font-weight: 700;">GHS 95.00/crate</span></div>
                    <div class="ticker-item" style="display: inline-block; white-space: nowrap; flex-shrink: 0;">Garden Eggs: <span style="color: #059669; font-weight: 700;">GHS 80.00/bag</span></div>
                    <div class="ticker-item" style="display: inline-block; white-space: nowrap; flex-shrink: 0;">Yam: <span style="color: #059669; font-weight: 700;">GHS 150.00/tuber</span></div>
                </div>
            </div>
        </div>
        <div style="display: flex; align-items: center; gap: 12px;">
            <!-- Date & Time -->
            <div style="font-size: 12px; color: #64748b; font-weight: 600;">
                <i class="fa-regular fa-calendar-days" style="color: #10b981;"></i> <span id="header-date">July 27, 2026</span>
            </div>
        </div>
    </div>

    <!-- Main Navigation/Title Row -->
    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; flex-wrap: wrap; gap: 16px;">
        <div style="display: flex; align-items: center;">
            <button id="mobile-menu-toggle" class="btn btn-secondary mobile-only" style="width: auto; padding: 8px 12px; margin-right: 12px; display: none; align-items: center; justify-content: center;">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="header-left">
                <h1 id="tab-title" style="font-size: 26px; font-weight: 800; font-family: var(--font-display); letter-spacing: -0.5px; color: #0f172a;">Marketplace</h1>
                <p id="tab-subtitle" class="text-secondary" style="font-size: 13px; color: #64748b;">Discover fresh vegetables directly from smallholders in Bono East</p>
            </div>
        </div>
        
        <div class="header-right" style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
            <!-- Cart Button -->
            <button id="header-cart-btn" class="btn btn-secondary" style="width: auto; padding: 8px 18px; font-size: 13px; display: none; position: relative; border-radius: 50px; background-color: #ffffff; border: 1px solid #cbd5e1; box-shadow: 0 2px 6px rgba(0,0,0,0.04); color: #0f172a;">
                <i class="fa-solid fa-cart-shopping" style="color: #10b981;"></i> Cart (<span id="header-cart-badge">0</span>)
            </button>
            <!-- Alerts Bell Button -->
            <button id="header-alerts-btn" class="btn btn-secondary" style="width: auto; padding: 8px 14px; font-size: 14px; position: relative; border-radius: 50px; background-color: #ffffff; border: 1px solid #cbd5e1; box-shadow: 0 2px 6px rgba(0,0,0,0.04); display: flex; align-items: center; justify-content: center; cursor: pointer; color: #0f172a;">
                <i class="fa-solid fa-bell" style="color: #10b981;"></i>
                <span id="header-alerts-badge" style="display: none; position: absolute; top: 4px; right: 6px; width: 8px; height: 8px; background-color: var(--red-alert); border-radius: 50%;"></span>
            </button>
            <!-- Wallet Display -->
            <div class="wallet-pill" style="background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%); border: 1px solid #fde68a; color: #92400e; border-radius: 50px; padding: 8px 18px; display: flex; align-items: center; gap: 8px; font-weight: 700; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.12);">
                <i class="fa-solid fa-wallet" style="color: #f59e0b !important;"></i>
                <span>Wallet: GHS <span id="header-wallet-balance">0.00</span></span>
            </div>
        </div>
    </div>
</header>
