<div id="cart-modal" class="fixed inset-0 z-[2000] hidden">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity" id="cart-backdrop"></div>
    
    <!-- Drawer -->
    <div class="absolute right-0 top-0 h-full w-full sm:w-[450px] bg-slate-50 shadow-2xl flex flex-col transform transition-transform translate-x-full" id="cart-drawer">
        
        <!-- Header -->
        <div class="bg-white border-b border-slate-200 p-6 flex justify-between items-center shrink-0">
            <h3 class="font-outfit font-bold text-xl m-0 text-slate-800 flex items-center gap-3">
                <div class="w-10 h-10 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center border border-emerald-200 shadow-sm">
                    <i class="fa-solid fa-cart-shopping text-lg"></i>
                </div>
                Shopping Cart
            </h3>
            <button id="cart-close-btn" class="text-slate-400 hover:text-slate-700 hover:bg-slate-100 w-8 h-8 rounded-full transition-colors flex items-center justify-center">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>

        <!-- Body -->
        <div class="flex-1 overflow-y-auto p-4 flex flex-col gap-4 hide-scrollbar" id="cart-items-container">
            <!-- Dynamic Cart Items here -->
        </div>

        <!-- Footer -->
        <div class="bg-white border-t border-slate-200 p-6 shrink-0 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
            <div class="flex justify-between items-center text-sm text-slate-500 mb-2 font-medium">
                <span>Produce Total:</span>
                <span id="cart-produce-total" class="text-slate-800">GHS 0.00</span>
            </div>
            <div class="flex justify-between items-center text-sm text-slate-500 mb-4 font-medium">
                <span>Est. Logistics Total:</span>
                <span id="cart-logistics-total" class="text-slate-800">GHS 0.00</span>
            </div>
            
            <div class="h-px bg-slate-200 w-full mb-4"></div>
            
            <div class="flex justify-between items-center mb-6">
                <strong class="text-base text-slate-800 font-bold uppercase tracking-wide">Grand Total:</strong>
                <strong class="text-2xl text-emerald-600 font-outfit font-extrabold" id="cart-grand-total">GHS 0.00</strong>
            </div>
            
            <button id="cart-checkout-btn" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-500/30 transition-all transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2">
                <i class="fa-solid fa-shield-halved"></i> Secure Escrow Checkout
            </button>
        </div>
    </div>
</div>
