<div id="withdraw-modal" class="fixed inset-0 z-[2000] hidden items-center justify-center">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity" id="withdraw-backdrop"></div>
    
    <!-- Modal Dialog -->
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md transform transition-all relative overflow-hidden flex flex-col z-10 mx-4 fade-in-up">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-amber-500 to-orange-500 p-6 relative">
            <button id="withdraw-btn-close-x" class="absolute top-4 right-4 text-amber-100 hover:text-white w-8 h-8 rounded-full hover:bg-white/10 transition-colors flex items-center justify-center">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center backdrop-blur-sm border border-white/30 text-white shadow-inner">
                    <i class="fa-solid fa-money-bill-transfer text-2xl"></i>
                </div>
                <div>
                    <h4 class="font-outfit font-bold text-2xl m-0 text-white">Withdraw Funds</h4>
                    <p class="text-amber-50 text-sm opacity-90 m-0">Transfer balance to MoMo or Bank</p>
                </div>
            </div>
        </div>

        <!-- Body -->
        <div class="p-6">
            <div class="flex items-start gap-3 bg-amber-50 text-amber-700 p-3 rounded-xl mb-6 border border-amber-100 text-sm">
                <i class="fa-solid fa-building-columns mt-0.5 text-amber-500"></i>
                <span>Withdrawals are processed to your registered Mobile Money or Bank Account within <strong>24 hours</strong>.</span>
            </div>
            
            <form id="withdraw-form">
                <div id="withdraw-error" class="hidden bg-red-50 text-red-600 p-3 rounded-xl mb-4 text-sm font-medium border border-red-100 flex items-center gap-2">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span id="withdraw-error-text"></span>
                </div>
                
                <label for="withdraw-amount" class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 block">Amount to Withdraw</label>
                <div class="relative mb-4">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <span class="text-slate-400 font-bold">GHS</span>
                    </div>
                    <input type="number" id="withdraw-amount" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 pl-12 pr-4 text-xl font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500 transition-all" min="1" placeholder="0.00" required>
                </div>
                
                <label class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 block">Withdrawal Channel</label>
                <div class="flex gap-2 mb-4" id="withdraw-channel-cards">
                    <div class="channel-sel-card active flex-1 bg-amber-50 border border-amber-500 text-amber-700 rounded-xl py-3 flex flex-col items-center justify-center gap-2 cursor-pointer transition-colors shadow-sm" data-value="mobile_money">
                        <i class="fa-solid fa-mobile-screen-button text-xl"></i>
                        <span class="text-xs font-bold">Mobile Money</span>
                    </div>
                    <div class="channel-sel-card flex-1 bg-white border border-slate-200 text-slate-500 hover:border-amber-400 hover:text-amber-600 rounded-xl py-3 flex flex-col items-center justify-center gap-2 cursor-pointer transition-colors shadow-sm" data-value="bank_account">
                        <i class="fa-solid fa-building-columns text-xl"></i>
                        <span class="text-xs font-bold">Bank Account</span>
                    </div>
                </div>
                <input type="hidden" id="withdraw-channel" value="mobile_money" required>
                
                <div id="withdraw-bank-group" class="mb-4 hidden">
                    <label for="withdraw-bank-code" class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 block">Select Bank</label>
                    <select id="withdraw-bank-code" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 text-sm font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500 transition-all appearance-none">
                        <option value="070101">GCB Bank</option>
                        <option value="030301">Ecobank Ghana</option>
                        <option value="020101">Absa Bank Ghana</option>
                        <option value="100101">Fidelity Bank Ghana</option>
                        <option value="040101">Agricultural Development Bank (ADB)</option>
                    </select>
                </div>

                <label id="withdraw-acct-label" for="withdraw-account-number" class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 block">Mobile Money Phone Number</label>
                <div class="relative mb-6">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i id="withdraw-acct-icon" class="fa-solid fa-phone text-slate-400"></i>
                    </div>
                    <input type="text" id="withdraw-account-number" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 pl-10 pr-4 text-sm font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500 transition-all" placeholder="e.g. 0241112222" required>
                </div>
                
                <div class="flex gap-3">
                    <button type="button" id="withdraw-btn-cancel" class="flex-1 py-3.5 bg-white border border-slate-200 text-slate-600 rounded-xl font-bold hover:bg-slate-50 transition-colors">Cancel</button>
                    <button type="submit" id="withdraw-btn-submit" class="flex-[2] py-3.5 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white rounded-xl font-bold shadow-lg shadow-amber-500/30 transition-all transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2">
                        <span class="btn-text"><i class="fa-solid fa-paper-plane mr-1"></i> Submit Request</span>
                        <span class="spinner hidden"><i class="fa-solid fa-circle-notch fa-spin"></i> Processing...</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const channelSelect = document.getElementById('withdraw-channel');
    const bankGroup = document.getElementById('withdraw-bank-group');
    const bankSelect = document.getElementById('withdraw-bank-code');
    const acctLabel = document.getElementById('withdraw-acct-label');
    const acctInput = document.getElementById('withdraw-account-number');
    const acctIcon = document.getElementById('withdraw-acct-icon');
    const channelCards = document.querySelectorAll('#withdraw-channel-cards .channel-sel-card');

    if (channelCards && channelSelect) {
        channelCards.forEach(card => {
            card.addEventListener('click', () => {
                channelCards.forEach(c => c.className = 'channel-sel-card flex-1 bg-white border border-slate-200 text-slate-500 hover:border-amber-400 hover:text-amber-600 rounded-xl py-3 flex flex-col items-center justify-center gap-2 cursor-pointer transition-colors shadow-sm');
                card.className = 'channel-sel-card active flex-1 bg-amber-50 border border-amber-500 text-amber-700 rounded-xl py-3 flex flex-col items-center justify-center gap-2 cursor-pointer transition-colors shadow-sm';
                channelSelect.value = card.dataset.value;
                channelSelect.dispatchEvent(new Event('change'));
            });
        });
    }

    if (channelSelect) {
        channelSelect.addEventListener('change', () => {
            if (channelSelect.value === 'bank_account') {
                bankGroup.classList.remove('hidden');
                bankSelect.required = true;
                acctLabel.textContent = "Bank Account Number";
                acctInput.placeholder = "e.g. 1010982736451";
                if (acctIcon) acctIcon.className = "fa-solid fa-hashtag text-slate-400";
            } else {
                bankGroup.classList.add('hidden');
                bankSelect.required = false;
                acctLabel.textContent = "Mobile Money Phone Number";
                acctInput.placeholder = "e.g. 0241112222";
                if (acctIcon) acctIcon.className = "fa-solid fa-phone text-slate-400";
            }
        });
    }
});
</script>
