<!-- ⚖️ ADMIN DISPUTE MEDIATION MODAL -->
<div class="modal-backdrop" id="mediation-modal" style="display: none;">
    <div class="momo-dialog" style="border-color: #8b5cf6; max-width: 540px; width: 90%;">
        <div class="momo-header" style="background-color: #7c3aed; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 16px;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <div class="momo-provider-logo" style="background-color: #fff; color: #7c3aed; font-size: 16px;">
                    <i class="fa-solid fa-gavel"></i>
                </div>
                <h4 style="font-family: var(--font-display); font-weight: 700; margin: 0;">Dispute Arbitration & Mediation Engine</h4>
            </div>
            <button id="mediation-close-btn" style="background: none; border: none; color: #fff; font-size: 18px; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="momo-body p-4 text-left">
            <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(124, 58, 237, 0.08); padding: 10px 14px; border-radius: var(--radius-sm);" class="mb-3">
                <span class="font-xs font-semibold text-purple" id="mediation-dispute-title">Dispute #</span>
                <a href="/admin/orders/dispute/" target="_blank" class="btn btn-secondary btn-sm" style="font-size: 11px;">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i> Open Admin Panel
                </a>
            </div>

            <form id="mediation-form">
                <input type="hidden" id="mediation-dispute-id">
                
                <div class="form-group mb-3">
                    <label class="font-xs font-semibold mb-2" style="display: block;">Select Mediation Resolution</label>
                    
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <label style="display: flex; align-items: flex-start; gap: 10px; padding: 10px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); cursor: pointer; background: var(--bg-main);">
                            <input type="radio" name="mediation_choice" value="REFUND_BUYER" checked style="margin-top: 3px;">
                            <div>
                                <strong style="color: #7c3aed; font-size: 12px;">⚖️ Full Refund to Buyer (100%)</strong>
                                <p class="font-xxs text-secondary mb-0">Refunds total produce cost to buyer's wallet and optionally restocks produce inventory.</p>
                            </div>
                        </label>

                        <label style="display: flex; align-items: flex-start; gap: 10px; padding: 10px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); cursor: pointer; background: var(--bg-main);">
                            <input type="radio" name="mediation_choice" value="RELEASE_FARMER" style="margin-top: 3px;">
                            <div>
                                <strong style="color: #10b981; font-size: 12px;">🌾 Release Escrow to Farmer (Dismiss Claim)</strong>
                                <p class="font-xxs text-secondary mb-0">Dismisses dispute and releases produce payment to farmer and logistics fee to driver.</p>
                            </div>
                        </label>

                        <label style="display: flex; align-items: flex-start; gap: 10px; padding: 10px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); cursor: pointer; background: var(--bg-main);">
                            <input type="radio" name="mediation_choice" value="PARTIAL_SPLIT" style="margin-top: 3px;">
                            <div>
                                <strong style="color: #0284c7; font-size: 12px;">✂️ Partial Split (50% Refund / 50% Release)</strong>
                                <p class="font-xxs text-secondary mb-0">Splits escrow balance equally between buyer refund and farmer payout.</p>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="form-group mb-3">
                    <label class="font-xs font-semibold mb-1" style="display: block;">Arbitration Notes & Rationale</label>
                    <textarea id="mediation-notes" class="form-control" rows="3" placeholder="Enter findings, quality inspection results, or arbitration notes..." style="width: 100%; padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-primary);" required>Resolved via platform escrow mediation</textarea>
                </div>

                <div class="momo-actions mt-4" style="display: flex; gap: 12px;">
                    <button type="button" id="mediation-cancel-btn" class="btn btn-secondary" style="flex: 1;">Cancel</button>
                    <button type="submit" class="btn btn-primary" style="flex: 2; background-color: #7c3aed; color: #fff;">
                        <i class="fa-solid fa-gavel"></i> Execute Mediation Resolution
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
