    <!-- Hire / Assign Driver Modal Dialog -->
    <div class="modal-backdrop" id="assign-driver-modal" style="display: none;">
        <div class="momo-dialog glass-panel fade-in-up">
            <div class="momo-header" style="background: linear-gradient(135deg, var(--amber-gold), #fcd34d); color: #0b0f19;">
                <div class="momo-provider-logo" style="background-color: #0b0f19; color: var(--amber-gold);"><i class="fa-solid fa-truck-moving"></i></div>
                <h4 style="margin: 0; font-family: var(--font-display); font-weight: 800;">Hire/Assign Driver</h4>
            </div>
            <div class="momo-body p-4">
                <div class="momo-info-box">
                    <i class="fa-solid fa-circle-info"></i>
                    <span>Choose an available transporter in Bono East to deliver this order.</span>
                </div>
                <form id="assign-driver-form">
                    <input type="hidden" id="assign-job-id">
                    <div id="assign-driver-error" class="alert alert-danger mb-3" style="display: none; font-size: 12px; color: var(--red-alert); background: rgba(239, 68, 68, 0.1); padding: 10px; border-radius: 6px;"></div>
                    
                    <div class="form-group">
                        <label for="assign-driver-select">Select Driver</label>
                        <div class="input-icon-wrapper select-wrapper">
                            <i class="fa-solid fa-truck"></i>
                            <select id="assign-driver-select" class="form-control" required>
                                <option value="">-- Loading drivers --</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group mt-3">
                        <label>Who will pay for logistics?</label>
                        <div style="display: flex; gap: 15px; margin-top: 5px;">
                            <label style="display: flex; align-items: center; gap: 5px; font-size: 13px;">
                                <input type="radio" name="assign_paid_by" value="FARMER" checked> I will pay (Deduct from my Wallet)
                            </label>
                            <label style="display: flex; align-items: center; gap: 5px; font-size: 13px;">
                                <input type="radio" name="assign_paid_by" value="BUYER"> Client will pay
                            </label>
                        </div>
                    </div>
                    
                    <div class="momo-actions mt-4 gap-2 flex">
                        <button type="button" id="assign-driver-cancel" class="btn btn-secondary flex-1">Cancel</button>
                        <button type="submit" class="btn btn-orange flex-2">
                            <span class="btn-text">Assign Driver</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
