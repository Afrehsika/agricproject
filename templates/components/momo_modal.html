<!-- 💳 PAYSTACK SECURE PAYMENT MODAL -->
<div class="modal-backdrop" id="momo-modal" style="display: none;">
    <div class="momo-dialog" style="border-color: #09a5db;">
        <div class="momo-header" style="background-color: #09a5db; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 16px;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <div class="momo-provider-logo" style="background-color: #fff; color: #09a5db; font-size: 16px;">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h4 style="font-family: var(--font-display); font-weight: 700; margin: 0;">Paystack Checkout</h4>
            </div>
            <button id="momo-close-btn" style="background: none; border: none; color: #fff; font-size: 18px; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="momo-body text-center p-4">
            <div style="margin-bottom: 20px;">
                <img src="https://files.readme.io/503b41d-paystack-logo-clean.png" alt="Paystack Logo" style="height: 24px; object-fit: contain;">
            </div>
            <p class="mt-3 font-sm text-secondary">
                Authorize payment of <strong class="text-emerald" id="momo-amount">GHS 0.00</strong> to the platform.
            </p>
            <p class="font-xxs text-secondary mt-1">
                You will be redirected or a Paystack payment popup will open to securely complete this transaction.
            </p>
            <div class="momo-actions mt-4" style="display: flex; gap: 12px;">
                <button id="momo-btn-cancel" class="btn btn-secondary" style="flex: 1;">Cancel</button>
                <button id="momo-btn-confirm" class="btn btn-primary" style="flex: 2; background-color: #09a5db; color: #fff;">
                    <i class="fa-solid fa-lock"></i> Authorize Payment
                </button>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const closeBtn = document.getElementById('momo-close-btn');
    if (closeBtn) {
        closeBtn.onclick = () => {
            document.getElementById('momo-modal').style.display = 'none';
        };
    }
});
</script>
