<!-- 🏭 Storage Facility & Quality Inspection Modal -->
<div id="storage-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm transition-opacity duration-300" style="display: none;">
    <div class="bg-white rounded-3xl shadow-2xl overflow-hidden w-[95%] max-w-2xl transform transition-all duration-300 scale-100 flex flex-col max-h-[90vh]">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-emerald-900 to-emerald-700 px-6 py-5 flex items-center justify-between shrink-0">
            <h3 class="text-white font-black text-lg flex items-center gap-3 m-0">
                <div class="w-10 h-10 rounded-xl bg-white/10 backdrop-blur-sm border border-white/20 flex items-center justify-center text-emerald-300 shadow-sm shrink-0">
                    <i class="fa-solid fa-warehouse"></i>
                </div>
                Register Storage Facility
            </h3>
            <button class="text-emerald-200 hover:text-white transition-colors bg-white/5 hover:bg-white/10 rounded-lg w-8 h-8 flex items-center justify-center shrink-0" onclick="closeStorageModal()">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        
        <!-- Body (Scrollable) -->
        <div class="p-6 overflow-y-auto flex-1 bg-slate-50">
            <!-- Informational Alert -->
            <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 mb-6 shadow-sm flex gap-3 items-start">
                <div class="text-emerald-600 text-xl shrink-0 mt-0.5"><i class="fa-solid fa-shield-check"></i></div>
                <div>
                    <h5 class="text-emerald-800 font-bold text-sm mb-1">Assured Freshness Guarantee</h5>
                    <p class="text-xs text-emerald-700/90 leading-relaxed font-medium m-0">Facilities registered here undergo quality inspection by AgriConnect Platform Auditors. Verified facilities receive an inspection badge (❄️ Gold, 🌿 Silver, 📦 Bronze) displayed on all your marketplace crop listings!</p>
                </div>
            </div>

            <!-- Facility Registration Form -->
            <form id="register-storage-form" class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4">
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Facility / Warehouse Name</label>
                    <input type="text" id="storage-name" class="w-full border-slate-200 bg-slate-50 rounded-xl px-4 py-2.5 text-sm font-medium text-slate-700 focus:ring-emerald-500 focus:border-emerald-500 focus:bg-white transition-colors" placeholder="e.g. Techiman Solar-Cool Room #1" required>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Storage Technology Type</label>
                        <select id="storage-type" class="w-full border-slate-200 bg-slate-50 rounded-xl px-4 py-2.5 text-sm font-medium text-slate-700 focus:ring-emerald-500 focus:border-emerald-500 focus:bg-white transition-colors cursor-pointer" required>
                            <option value="SOLAR_COLD_ROOM">☀️ Solar-Powered Cold Room (4°C - 12°C)</option>
                            <option value="EVAPORATIVE_COOLER">🌿 Evaporative Cooling Chamber (14°C - 18°C)</option>
                            <option value="REFRIGERATED_WAREHOUSE">❄️ Refrigerated Cold Chain Warehouse</option>
                            <option value="VENTILATED_BARN">📦 Inspected Ventilated Dry Barn</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Storage Capacity</label>
                        <input type="text" id="storage-capacity" class="w-full border-slate-200 bg-slate-50 rounded-xl px-4 py-2.5 text-sm font-medium text-slate-700 focus:ring-emerald-500 focus:border-emerald-500 focus:bg-white transition-colors" placeholder="e.g. 500 Crates / 10 Tonnes" required>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Location / District / GPS</label>
                        <input type="text" id="storage-location" class="w-full border-slate-200 bg-slate-50 rounded-xl px-4 py-2.5 text-sm font-medium text-slate-700 focus:ring-emerald-500 focus:border-emerald-500 focus:bg-white transition-colors" placeholder="e.g. Techiman Central Market" required>
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Operating Temp & RH</label>
                        <input type="text" id="storage-temp" class="w-full border-slate-200 bg-slate-50 rounded-xl px-4 py-2.5 text-sm font-medium text-slate-700 focus:ring-emerald-500 focus:border-emerald-500 focus:bg-white transition-colors" placeholder="e.g. 8°C - 12°C / 85% RH" value="8°C - 12°C / 85% RH">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Photo URL (Optional)</label>
                    <input type="url" id="storage-photo-url" class="w-full border-slate-200 bg-slate-50 rounded-xl px-4 py-2.5 text-sm font-medium text-slate-500 focus:ring-emerald-500 focus:border-emerald-500 focus:bg-white transition-colors" placeholder="https://images.unsplash.com/photo-...">
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white font-bold py-3.5 rounded-xl mt-4 shadow-lg shadow-emerald-500/25 transition-all transform hover:-translate-y-0.5 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> Submit for Admin Inspection
                </button>
            </form>

            <div class="mt-8 mb-4 flex items-center justify-between">
                <h4 class="font-bold text-slate-800 text-base flex items-center gap-2 m-0">
                    <div class="w-8 h-8 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center text-sm"><i class="fa-solid fa-boxes-packing"></i></div> 
                    My Storage Facilities
                </h4>
            </div>

            <!-- Registered Facilities List -->
            <div id="storage-facilities-list-container" class="space-y-3">
                <!-- Dynamically populated -->
            </div>
        </div>

        <!-- Footer -->
        <div class="bg-white border-t border-slate-100 p-4 flex justify-end shrink-0">
            <button type="button" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold px-6 py-2.5 rounded-xl transition-colors text-sm" onclick="closeStorageModal()">Close</button>
        </div>
    </div>
</div>
