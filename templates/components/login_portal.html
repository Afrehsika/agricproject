<div class="login-portal-backdrop" id="login-portal" style="display: flex;">
    <div class="login-portal-card glass">
        <div class="login-portal-header">
            <div class="logo">
                <i class="fa-solid fa-leaf text-emerald"></i>
                <span>AgriConnect <span class="accent">Market</span></span>
            </div>
            <p class="text-secondary font-sm">Techiman Vegetable Hub Digital Escrow Marketplace</p>
        </div>

        <!-- Switch Tab Buttons -->
        <div class="login-tab-headers">
            <button class="login-tab-btn active" id="tab-btn-login">Sign In</button>
            <button class="login-tab-btn" id="tab-btn-register">Register</button>
        </div>

        <!-- 1. SIGN IN FORM -->
        <form id="login-form" class="login-portal-form">
            <div class="form-group">
                <label for="login-username">Username</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="login-username" class="form-control" placeholder="Enter username" required autocomplete="username">
                </div>
            </div>
            <div class="form-group mt-3">
                <label for="login-password">Password</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="login-password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block mt-4">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In to Account
            </button>
        </form>

        <!-- 2. REGISTRATION FORM -->
        <form id="register-form" class="login-portal-form" style="display: none;">
            <div class="form-group">
                <label for="reg-username">Username</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="reg-username" class="form-control" placeholder="Choose username" required autocomplete="username">
                </div>
            </div>
            <div class="form-group mt-2">
                <label for="reg-password">Password</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="reg-password" class="form-control" placeholder="Choose password" required autocomplete="new-password">
                </div>
            </div>
            <div class="form-row mt-2">
                <div class="form-group col">
                    <label for="reg-role">Market Role</label>
                    <select id="reg-role" class="form-control" required>
                        <option value="FARMER">Farmer (Seller)</option>
                        <option value="BUYER">Buyer (Restaurant/Wholesaler)</option>
                        <option value="TRANSPORTER">Transporter (Logistics Provider)</option>
                    </select>
                </div>
                <div class="form-group col">
                    <label for="reg-phone">Phone Number</label>
                    <input type="text" id="reg-phone" class="form-control" placeholder="e.g. 0241112222" required>
                </div>
            </div>
            <div class="form-row mt-2">
                <div class="form-group col">
                    <label for="reg-region">Region</label>
                    <input type="text" id="reg-region" class="form-control" value="Bono East" required>
                </div>
                <div class="form-group col">
                    <label for="reg-district">District / Location</label>
                    <input type="text" id="reg-district" class="form-control" value="Techiman Municipal" required>
                </div>
            </div>
            <button type="submit" class="btn btn-emerald btn-block mt-4">
                <i class="fa-solid fa-user-plus"></i> Create Account & Sign In
            </button>
        </form>

        <hr class="border-slate my-4">

        <!-- 3. QUICK DEMO PROFILE LOGINS -->
        <div class="demo-profiles-container">
            <h5 class="text-secondary text-center font-xxs weight-600 tracking-wider uppercase mb-3">Quick-Demo Access (No Password)</h5>
            <div class="demo-profiles-grid">
                <button class="btn btn-demo-login demo-farmer" id="demo-login-farmer">
                    <i class="fa-solid fa-wheat-awn text-emerald"></i>
                    <div>
                        <strong>Kofi Mensah</strong>
                        <span>Farmer profile</span>
                    </div>
                </button>
                <button class="btn btn-demo-login demo-buyer" id="demo-login-buyer">
                    <i class="fa-solid fa-cart-shopping text-sky"></i>
                    <div>
                        <strong>Restaurant Hub</strong>
                        <span>Buyer profile</span>
                    </div>
                </button>
                <button class="btn btn-demo-login demo-transporter" id="demo-login-transporter">
                    <i class="fa-solid fa-truck text-amber"></i>
                    <div>
                        <strong>Kojo Logistics</strong>
                        <span>Transporter profile</span>
                    </div>
                </button>
            </div>
        </div>
    </div>
</div>
