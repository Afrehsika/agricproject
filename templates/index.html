{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriConnect Ghana - Farmer-to-Buyer Digital Escrow & Logistics Marketplace</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}?v=3.0">
</head>

<body>
    {% if not user.is_authenticated %}
    <!-- 🌿 Public Landing Page -->
    <div id="landing-page-wrapper">
        {% include 'components/landing_page.html' %}
    </div>

    <!-- 🔑 Login / Register Portal Overlay -->
    {% include 'components/login_portal.html' %}
    {% endif %}

    <!-- 🔔 Notification Toasts Container -->
    <div id="alert-toasts-container" class="alert-toasts-container"></div>

    <!-- Frontend JS -->
    <script src="{% static 'js/app.js' %}?v=4.1"></script>
</body>
</html>
